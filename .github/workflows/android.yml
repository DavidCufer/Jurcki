name: Android debug APK

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs the command-line tools, accepts the SDK licences and exports ANDROID_HOME.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      # JVM unit tests (engine parity vectors, no network) first, then the APK.
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon --stacktrace --continue testDebugUnitTest assembleDebug

      # Asset names can be changed by the packager (e.g. *.gz); fail if any model file is missing.
      - name: Check model assets in APK
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          for f in model.json habitat.u8.bin elev.i16.bin mask.u8.bin finds.json stats.json; do
            unzip -l "$apk" | grep -q "assets/model/$f\$" || { echo "missing assets/model/$f in $apk"; exit 1; }
          done

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # --continue builds the APK even when a unit test fails (the step is still red).
      - name: Upload APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jurcki-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
