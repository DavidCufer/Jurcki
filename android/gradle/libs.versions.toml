[versions]
# Android Gradle Plugin 8.13.x needs Gradle >= 8.13 (wrapper pins 8.14.3), JDK 17, compileSdk <= 36.
agp = "8.13.2"
# Kotlin and the Compose compiler plugin MUST share one version (Kotlin 2.x ships the compiler plugin).
kotlin = "2.2.21"
# BOM 2025.10.01 -> Compose UI/Foundation 1.9.4, Material3 1.4.0
composeBom = "2025.10.01"
activityCompose = "1.11.0"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
datastore = "1.1.7"
coroutines = "1.10.2"
# Same OkHttp line that MapLibre Android 13.x depends on (4.12.0) -> no version conflict.
okhttp = "4.12.0"
# OpenGL ES flavour of MapLibre Native Android (the plain `android-sdk` artifact is the Vulkan build
# with a <uses-feature vulkan required="true"> that would hide the app from non-Vulkan devices).
maplibre = "13.7.1"
# JVM unit tests: Android's org.json is a stub in local unit tests, so the real library is added for tests only.
junit = "4.13.2"
orgJson = "20240303"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
maplibre-android = { module = "org.maplibre.gl:android-sdk-opengl", version.ref = "maplibre" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
